<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% if page and page.title %}{{ page.title }}{% elif section and section.title %}{{ section.title }}{% else %}{{ config.title }}{% endif %}{% endblock %}</title>
  <meta name="description" content="{% if page and page.description %}{{ page.description }}{% else %}{{ config.extra.description }}{% endif %}">
  <meta name="author" content="{{ config.extra.author }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ get_url(path='rss.xml') }}">
  <link rel="icon" type="image/webp" href="{{ get_url(path='images/favicon.webp') }}">
</head>
<body>
{% include "header.html" %}
<main>
{% block content %}{% endblock %}
</main>
{% include "footer.html" %}
{% if page and page.extra.script %}<script src="{{ get_url(path=page.extra.script) }}"></script>{% endif %}
</body>
</html>
