{% extends "base.html" %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  <p class="meta"><time datetime="{{ page.date }}">{{ page.date }}</time></p>
  {{ page.content | safe }}
  {% if page.taxonomies.tags %}
  <p class="tags">
    {% for tag in page.taxonomies.tags %}<a href="{{ get_taxonomy_url(kind='tags', name=tag) }}">{{ tag }}</a> {% endfor %}
  </p>
  {% endif %}
</article>
{% endblock %}
