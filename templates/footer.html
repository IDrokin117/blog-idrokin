<footer class="site-footer">
  <div class="container site-footer__inner">
    <p>{{ config.extra.copyright_string | replace(from="%YEAR%", to=now() | date(format="%Y")) | markdown(inline=true) | safe }}</p>
    <p class="site-footer__links">
      <a href="{{ config.extra.github }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ config.extra.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="{{ get_url(path='rss.xml') }}">RSS</a>
    </p>
  </div>
</footer>
