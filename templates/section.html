{% extends "base.html" %}
{% block content %}
<h1>{{ section.title }}</h1>
{% include "series_block.html" %}
{{ section.content | safe }}
<ul class="post-list">
  {% for p in section.pages %}
  <li><a href="{{ p.permalink | safe }}">{{ p.title }}</a><time datetime="{{ p.date }}">{{ p.date | date(format="%b %-d, %Y") }}</time></li>
  {% endfor %}
</ul>
{% endblock %}
