# The URL the site will be built for
base_url = "https://www.idrokin.com/"
#base_url = "http://localhost:8000/"
title = "IDrokin"
default_language = "en"

minify_html = true
# Compile Sass files from the sass directory
compile_sass = true

generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
    { name = "tags" },
    { name = "series", render = false },
]

[markdown]
# External links in content open in a new tab (internal ones stay in the same tab)
external_links_target_blank = true
external_links_no_referrer = false
# Class-based highlighting; colors live in sass/style.scss (light and dark sets)
[markdown.highlighting]
style = "class"
light_theme = "solarized-light"
dark_theme = "solarized-dark"

[extra]
author = "Igor Drokin"
description = "Igor Drokin's Blog"
top_menu = [
    { name = "Home", path = "/" },
    { name = "Posts", path = "/posts/" },
    { name = "Resume", path = "/resume/" },
]

copyright_string = "Created by Igor Drokin in 2025 – %YEAR%. Powered by [zola](https://getzola.org/)."
avatar_src = "images/avatar.webp"
email = "drokinii1017@gmail.com"
github = "https://github.com/IDrokin117"
linkedin = "https://www.linkedin.com/in/igor-drokin-822233227/"
