# The URL the site will be built for
base_url = "https://www.idrokin.com/"
#base_url = "http://localhost:8000/"
title = "IDrokin"
default_language = "en"

minify_html = true
# Compile Sass files from the sass directory
compile_sass = true

generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
    { name = "tags" },
    { name = "series", render = false },
]

[markdown]
# Syntax highlighting theme is refined in the typography and themes ticket
[markdown.highlighting]
theme = "github-light"

