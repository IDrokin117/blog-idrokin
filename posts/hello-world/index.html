  var root = document.documentElement;
  var btns = document.querySelectorAll(".palette-switch button");
  function mark() {
    var cur = root.dataset.palette || "dark";
    btns.forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.set === cur); });
  }
  btns.forEach(function (b) {
    b.addEventListener("click", function () {
      root.dataset.palette = b.dataset.set;
      var dark = b.dataset.set === "dark";
      document.getElementById("hl-light").media = dark ? "not all" : "all";
      document.getElementById("hl-dark").media = dark ? "all" : "not all";
      try { localStorage.setItem("palette", b.dataset.set); } catch (e) {}
      mark();
    });
  });
  mark();
})();</script>
